<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Inteligente - Sin Repetición</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        #result {
            font-size: 2rem;
            font-weight: bold;
            margin: 2rem 0;
            min-height: 3rem;
            color: #0071e3;
        }
        button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #d2d2d7; cursor: not-allowed; }
        .info {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #86868b;
        }
        #config {
            margin-top: 1rem;
            text-align: left;
            display: none;
        }
        textarea {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            border: 1px solid #d2d2d7;
            padding: 0.5rem;
            margin-top: 0.5rem;
        }
        .toggle-config {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #0071e3;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="title">Ruleta 1</h1>
    <div id="result">¡Listo!</div>
    <button id="spinBtn">Girar Ruleta</button>

    <div class="info" id="status">Esperando...</div>

    <div class="toggle-config" onclick="toggleConfig()">Configurar Opciones</div>
    <div id="config">
        <p>Introduce tus listas (una ruleta por línea, opciones separadas por comas):</p>
        <textarea id="listInput">Opción A, Opción B, Opción C
1, 2, 3, 4, 5</textarea>
        <button onclick="saveConfig()" style="margin-top: 0.5rem; padding: 0.5rem 1rem; font-size: 0.9rem;">Guardar y Reiniciar</button>
    </div>
</div>

<script>
    let ruletas = [];
    let currentSetIndex = 0;
    let currentOptions = [];

    function init() {
        const input = document.getElementById('listInput').value;
        ruletas = input.split('\n').filter(line => line.trim() !== '').map(line => line.split(',').map(item => item.trim()));
        currentSetIndex = 0;
        loadNextSet();
    }

    function loadNextSet() {
        if (currentSetIndex < ruletas.length) {
            currentOptions = [...ruletas[currentSetIndex]];
            shuffle(currentOptions);
            document.getElementById('title').innerText = `Ruleta ${currentSetIndex + 1}`;
            updateStatus();
            currentSetIndex++;
        } else {
            currentOptions = [];
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('status').innerText = "¡No hay más ruletas!";
        }
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function updateStatus() {
        document.getElementById('status').innerText = `Quedan ${currentOptions.length} opciones.`;
    }

    document.getElementById('spinBtn').onclick = () => {
        if (currentOptions.length === 0) {
            loadNextSet();
            if (currentOptions.length === 0) return;
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.opacity = 0;

        setTimeout(() => {
            const selection = currentOptions.pop();
            resultDiv.innerText = selection;
            resultDiv.style.opacity = 1;
            updateStatus();

            if (currentOptions.length === 0) {
                if (currentSetIndex < ruletas.length) {
                    document.getElementById('status').innerText = "¡Ruleta completada! La próxima será diferente.";
                } else {
                    document.getElementById('status').innerText = "¡Has completado todas las ruletas!";
                }
            }
        }, 200);
    };

    function toggleConfig() {
        const config = document.getElementById('config');
        config.style.display = config.style.display === 'none' ? 'block' : 'none';
    }

    function saveConfig() {
        init();
        document.getElementById('spinBtn').disabled = false;
        document.getElementById('result').innerText = "¡Reiniciado!";
        toggleConfig();
    }

    init();
</script>

</body>
</html>
